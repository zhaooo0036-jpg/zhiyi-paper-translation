[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyi"
version = "0.1.0"
description = "纸译 · turn an English paper PDF into a Chinese .docx translation (figures, native equations, unified glossary)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.23", "python-docx>=1.0", "Pillow>=9"]

[project.scripts]
zhiyi = "zhiyi.cli:main"

[tool.setuptools]
packages = ["zhiyi"]
package-dir = { "zhiyi" = "." }

[tool.setuptools.package-data]
zhiyi = ["glossary.json", "SKILL.md"]
